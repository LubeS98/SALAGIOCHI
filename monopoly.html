<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monopoly — Sala da Gioco</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="css/monopoly.css" />
</head>
<body>

<div class="topbar">
  <a href="index.html" class="brand"><span class="dot"></span> SALA DA GIOCO</a>
  <div class="flex gap-12" style="align-items:center;">
    <div class="text-xs muted mono" id="gameCodeBadge">—</div>
    <button class="btn btn-ghost btn-sm" id="inviteBtn">Copia invito</button>
  </div>
</div>

<!-- ---------- LOBBY ---------- -->
<div id="lobbyScreen" class="container" style="padding-top:40px; display:none;">
  <div class="parchment" style="padding:30px; max-width:640px; margin:0 auto;">
    <h2 id="lobbyGameName">Tavolo Monopoly</h2>
    <p class="text-sm" style="color:var(--ink-soft)">In attesa che tutti i giocatori si uniscano. Condividi il codice qui sopra.</p>
    <div id="lobbyPlayers" class="flex gap-12" style="flex-wrap:wrap; margin:18px 0;"></div>
    <div id="lobbyControls"></div>
  </div>
</div>

<!-- ---------- GIOCO ---------- -->
<div id="gameScreen" style="display:none;">
  <div class="game-layout">

    <div class="board-panel wood-frame">
      <div class="map-header">
        <div id="turnBanner" class="turn-banner">Caricamento…</div>
        <div class="flex gap-8">
          <div id="lastRollBadge" class="phase-badge"></div>
        </div>
      </div>
      <div class="board-wrap">
        <div class="board-grid" id="boardGrid"></div>
      </div>
    </div>

    <div class="side-panel">
      <div class="parchment panel-block" id="actionPanel">
        <h3>Azioni</h3>
        <div id="actionContent"></div>
      </div>

      <div class="parchment panel-block" id="playersPanel">
        <h3>Giocatori</h3>
        <div id="playersList"></div>
      </div>

      <div class="parchment panel-block" id="propertiesPanel">
        <h3>Le tue proprietà</h3>
        <div id="propertiesList"></div>
      </div>

      <div class="parchment panel-block" id="historyPanel">
        <h3>Storico partita</h3>
        <div id="historyList" class="history-list"></div>
      </div>
    </div>
  </div>
</div>

<!-- modale carta / evento -->
<div class="modal-backdrop" id="cardModal" style="display:none;">
  <div class="modal parchment card-modal" style="max-width:420px;">
    <h2 id="cardModalTitle">Probabilità</h2>
    <div id="cardModalBody"></div>
    <button class="btn btn-gold btn-block" id="cardModalOk" style="margin-top:16px;">Ok</button>
  </div>
</div>

<!-- modale acquisto -->
<div class="modal-backdrop" id="buyModal" style="display:none;">
  <div class="modal parchment" style="max-width:420px;">
    <h2 id="buyModalTitle">Acquista?</h2>
    <div id="buyModalBody"></div>
  </div>
</div>

<!-- modale gestione case/hotel -->
<div class="modal-backdrop" id="buildModal" style="display:none;">
  <div class="modal parchment" style="max-width:520px;">
    <button class="close-x" onclick="document.getElementById('buildModal').style.display='none'">&times;</button>
    <h2>Costruisci case &amp; hotel</h2>
    <div id="buildModalBody"></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script type="module" src="js/monopoly.js"></script>
</body>
</html>
